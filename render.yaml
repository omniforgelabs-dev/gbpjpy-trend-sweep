services:
  - type: web
    name: gbpjpy-trend-sweep
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: EXN_IS_DEMO
        value: "true"
      - key: EXN_GATEWAY_HOST
        value: "https://api.exness-api.com"
      - key: EXN_DISCOVERY_BASE_URL
        value: "https://api.exness-api.com"
      - key: MAX_RISK_USD
        value: "1.00"
      - key: POLL_INTERVAL_MS
        value: "60000"
      - key: EXN_DRY_RUN
        value: "false"
      - key: EXN_API_KEY
        sync: false
      - key: EXN_PRIVATE_KEY
        sync: false
      - key: EXN_ACCOUNT_ID
        sync: false
